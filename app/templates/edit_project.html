<meta charset="UTF-8">{% extends "base.html" %}
{% block title %}编辑项目 · {{ p.name }}{% endblock %}
{% block content %}
<a class="back" href="{{ url_for('project_detail', pid=p.id) }}">← 返回项目详情</a>
<h1 style="margin-top:10px">编辑项目</h1>
<div class="lead">修改基础信息与前置参数。若调整「计划开工(T0)」，系统会自动按新基准重算交付日与全部计划节点。</div>

<div class="form-wrap">
  <form method="post">
    <label>项目名称 *</label>
    <input name="name" required value="{{ p.name }}">
    <label>委托方 / 甲方</label>
    <input name="client" placeholder="如：某城投集团" value="{{ p.client or '' }}">
    <label>业态楼型 *</label>
    <select name="building_type_id">
      {% for b in bts %}<option value="{{ b.id }}" {% if b.id == p.building_type_id %}selected{% endif %}>{{ b.name }}</option>{% endfor %}
    </select>
    <label>计划开工(T0) *</label>
    <input name="plan_start" required type="date" value="{{ p.plan_start }}">
    <label>项目状态</label>
    <select name="status">
      <option value="进行中" {% if p.status == '进行中' %}selected{% endif %}>进行中</option>
      <option value="已交付" {% if p.status == '已交付' %}selected{% endif %}>已交付</option>
      <option value="暂停" {% if p.status == '暂停' %}selected{% endif %}>暂停</option>
    </select>

    <h3 style="margin-top:22px; font-size:15px">前置信息（项目参数）</h3>
    <div class="lead">用于后续参数化期量（当前版本仅记录，不影响排程）。</div>
    {% include "prereq_form.html" %}

    <button class="btn" type="submit">保存修改</button>
    <a class="btn-cancel" href="{{ url_for('project_detail', pid=p.id) }}">取消</a>
  </form>
</div>
{% endblock %}
